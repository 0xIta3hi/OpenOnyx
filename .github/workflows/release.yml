name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux
            os: ubuntu-latest
            script: package:linux
            release_paths: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
              release/*.pacman
              release/*.pkg.tar.*
              release/*.blockmap
              release/latest-linux.yml
          - name: windows
            os: windows-latest
            script: package:win
            release_paths: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - name: macos
            os: macos-latest
            script: package:mac
            release_paths: |
              release/*.dmg
              release/*-mac.zip
              release/*.blockmap
              release/latest-mac.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcrypt1 rpm libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Check release icons
        shell: bash
        run: |
          test -f build/icon.png
          test -f build/icon.ico
          test -f build/icon.icns

      - name: Configure macOS code signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::CSC_LINK is not set — macOS build will be UNSIGNED and blocked by Gatekeeper"
          else
            echo "macOS signing credentials configured"
            echo "CSC_LINK=$CSC_LINK" >> $GITHUB_ENV
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> $GITHUB_ENV
            if [ -n "$APPLE_ID" ]; then
              echo "APPLE_ID=$APPLE_ID" >> $GITHUB_ENV
              echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> $GITHUB_ENV
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> $GITHUB_ENV
            fi
          fi

      - name: Configure Windows code signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then
            echo "::warning::WIN_CSC_LINK is not set — Windows build will not be signed"
          else
            echo "Windows signing credentials configured"
            echo "WIN_CSC_LINK=$WIN_CSC_LINK" >> $GITHUB_ENV
            echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> $GITHUB_ENV
          fi

      - name: Build installers
        run: npm run ${{ matrix.platform.script }}

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: ${{ matrix.platform.release_paths }}
          fail_on_unmatched_files: false
          generate_release_notes: ${{ matrix.platform.name == 'linux' }}
