name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: false
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux
            os: ubuntu-latest
            script: package:linux
            artifact_name: linux-installers
            artifact_paths: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
              release/*.pacman
              release/*.pkg.tar.*
              release/*.blockmap
              release/latest-linux.yml
          - name: windows
            os: windows-latest
            script: package:win
            artifact_name: windows-installers
            artifact_paths: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - name: macos
            os: macos-latest
            script: package:mac
            artifact_name: macos-installers
            artifact_paths: |
              release/*.dmg
              release/*-mac.zip
              release/*.blockmap
              release/latest-mac.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcrypt1 rpm libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Check release icons
        shell: bash
        run: |
          test -f build/icon.png
          test -f build/icon.ico
          test -f build/icon.icns

      - name: Build installers
        run: npm run ${{ matrix.platform.script }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: ${{ matrix.platform.artifact_paths }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
